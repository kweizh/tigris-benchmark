l variable unset, and save the body to `/home/user/tigris-task/downloaded.txt`.\n\n## Constraints\n- Project path: `/home/user/tigris-task`\n- Presigned URL file: `/home/user/tigris-task/presigned.url` (single line, no trailing newline).\n- Downloaded artifact: `/home/user/tigris-task/downloaded.txt` (bytes must equal exactly `shareable content`, 17 bytes, no newline).\n- Bucket name MUST be exactly `harbor-presign-${trial_id}` where `${trial_id}` is read from `/logs/artifacts/trial_id`. Do NOT hardcode the suffix. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Object key MUST be exactly `share/secret.txt`.\n- Object body MUST be exactly the 17 bytes `shareable content` (no newline, no quotes).\n- The presigned URL MUST:\n  - Be generated for the HTTP `GET` (`get_object`) operation.\n  - Expire in `300` seconds (i.e. pass `ExpiresIn=300` to `generate_presigned_url`).\n  - Point at the Tigris virtual-hosted-style hostname `t3.storage.dev`.\n  - Contain the SigV4 query parameter `X-Amz-Signature`.\n- The curl command MUST be invoked in a subshell where `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `TIGRIS_STORAGE_ACCESS_KEY_ID`, and `TIGRIS_STORAGE_SECRET_ACCESS_KEY` are unset — the only authorization on the wire must be the presigned-URL query string.\n- Do NOT hardcode credentials or the endpoint URL in the helper script — read them from the standard `AWS_*` environment variables that Harbor injects.\n- Do NOT delete the bucket or object after finishing; the verifier handles cleanup.\n\n## Integrations\n- Tigris Object Storage. Harbor injects `TIGRIS_STORAGE_ACCESS_KEY_ID` / `TIGRIS_STORAGE_SECRET_ACCESS_KEY` / `TIGRIS_STORAGE_ENDPOINT` and the task runtime maps them onto the boto3-friendly `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `AWS_ENDPOINT_URL_S3` (= `https://t3.storage.dev`), and `AWS_REGION=auto`."])</script><script>self.__next_f.push([1,"19:T1caf,"])</script><script>self.__next_f.push([1,"# ReadOnly Workspace Write Denial with Tigris Agent Kit\n\n## Background\nTigris Agent Kit (`@tigrisdata/agent-kit`) provisions per-agent workspaces with TTL and **scoped IAM credentials**. A workspace's scoped credentials carry one of two roles: `Editor` (read+write) or `ReadOnly` (read only). To prove that scoped credentials actually enforce role boundaries, this task drives a real Tigris workspace through an editor-write, then mints a second set of `ReadOnly` credentials and demonstrates that those credentials can read existing objects but are denied when they try to write a new object.\n\nBecause `createWorkspace` only mints a single scoped key per call and the documented Agent Kit way to produce additional scoped credentials for the same dataset is `createForks` (which performs a copy-on-write snapshot of the source bucket and provisions per-fork scoped credentials), you will:\n1. Create the editor workspace with snapshots enabled.\n2. Write `notes/welcome.txt` into the editor workspace using the editor credentials.\n3. Use `createForks(... , 1, { credentials: { role: \"ReadOnly\" } })` to mint a single `ReadOnly` fork of the same data — the fork's scoped credentials are the **second** set of credentials referenced in the requirements, scoped to a copy-on-write view of the workspace contents.\n4. Use those ReadOnly credentials to attempt a forbidden write **and** a successful read against the fork bucket.\n5. Persist the captured denial error and the readback content to local log files.\n\n## Requirements\n- Write a TypeScript program at `/home/user/tigris-task/run.ts` and run it with `tsx /home/user/tigris-task/run.ts`.\n- The program must use `@tigrisdata/agent-kit` (for `createWorkspace` + `createForks`) and `@tigrisdata/storage` (for `put` and `get`).\n- The program must:\n  1. Read the current `trial_id` from `/logs/artifacts/trial_id` and trim whitespace.\n  2. Build the editor workspace name as `harbor-ro-${trial_id}` (lowercase trial id).\n  3. Call `createWorkspace(workspaceName, { ttl: { days: 1 }, enableSnapshots: true, credentials: { role: \"Editor\" } })`. Abort with a non-zero exit if `error` is set or if `data.credentials` is missing. Treat the returned `data.credentials` as the **editor credentials**.\n  4. Using the editor credentials, call `put` from `@tigrisdata/storage` to upload object key `notes/welcome.txt` with the exact body string `hello readonly` (no trailing newline) into the editor workspace bucket. Pass the editor credentials via the per-call `config` argument so the SDK does not fall back to the environment keys.\n  5. Call `createForks(workspaceBucket, 1, { prefix: \"harbor-ro-${trial_id}-readonly\", credentials: { role: \"ReadOnly\" } })`. Abort with a non-zero exit if `error` is set, if `forkSet.forks[0]` is missing, or if `forkSet.forks[0].credentials` is missing. The single fork bucket name will be `harbor-ro-${trial_id}-readonly-0`. Treat `forkSet.forks[0].credentials` as the **readonly credentials**. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n  6. Using the readonly credentials, attempt to `put` a new object `notes/forbidden.txt` with body `should be rejected` into the fork bucket. This write MUST be expected to fail because the scoped key has only ReadOnly permission. Capture the returned `error` (the SDK returns `{ data, error }` — do not throw). Stringify the error (include any HTTP status code or AWS error code such as `AccessDenied`/`Forbidden`/`403` that appears in the error message or its underlying cause) and write the resulting non-empty string to `/home/user/tigris-task/write-denial.log`. If the write unexpectedly succeeds (no `error`), exit non-zero — that would be a verification failure.\n  7. Using the readonly credentials, call `get(\"notes/welcome.txt\", \"string\", { config: { bucket: forkBucket, accessKeyId, secretAccessKey } })` from `@tigrisdata/storage`. The call must succeed and return the body `hello readonly`. Write the returned body verbatim to `/home/user/tigris-task/readback.txt` (no trailing newline, no extra whitespace).\n- The program must exit with code 0 only if all of the above steps completed as expected (editor write succeeded, readonly write was denied, readonly read succeeded).\n- Do not tear down the workspace or the fork — the verifier is responsible for cleanup.\n\n## Implementation Guide\n1. `cd /home/user/tigris-task`. The project is pre-initialized with a `package.json` and `tsconfig.json` and `node_modules` already populated with `@tigrisdata/agent-kit`, `@tigrisdata/storage`, and `tsx`.\n2. Create `run.ts` with the logic above. Use ES module imports, for example:\n   ```typescript\n   import { readFile, writeFile } from \"node:fs/promises\";\n   import { createWorkspace, createForks } from \"@tigrisdata/agent-kit\";\n   import { put, get } from \"@tigrisdata/storage\";\n   ```\n3. When uploading or reading with scoped credentials, pass `{ config: { bucket, accessKeyId, secretAccessKey } }` to each `put`/`get` call so the SDK uses the scoped key rather than the environment-provided admin key.\n4. For every SDK call, check the returned `{ data, error }` envelope and fail fast (exit non-zero with a descriptive `console.error`) if anything unexpected occurs.\n5. When the readonly write fails, capture the error like this (illustrative — adapt to the real error shape):\n   ```typescript\n   const denial = `${err.name ?? \"Error\"}: ${err.message ?? String(err)}`;\n   await writeFile(\"/home/user/tigris-task/write-denial.log\", denial, \"utf-8\");\n   ```\n   The captured string MUST contain an access-denial indicator such as `AccessDenied`, `Forbidden`, `not allowed`, `permission`, or HTTP status `403`. If the underlying error has nested `cause`/`Code`/`$metadata.httpStatusCode` fields, include those in the log line so the verifier can detect the keyword.\n6. Run the program with `tsx run.ts`. It should exit 0 and leave both `/home/user/tigris-task/write-denial.log` and `/home/user/tigris-task/readback.txt` on disk.\n\n## Constraints\n- Project path: /home/user/tigris-task\n- Source file: /home/user/tigris-task/run.ts\n- Write-denial log: /home/user/tigris-task/write-denial.log (non-empty; must contain an access-denial keyword)\n- Read-back file: /home/user/tigris-task/readback.txt (must equal exactly `hello readonly`)\n- Editor workspace bucket: `harbor-ro-${trial_id}` (with TTL 1 day, snapshots enabled, Editor scoped credentials)\n- ReadOnly fork bucket: `harbor-ro-${trial_id}-readonly-0` (created via `createForks` with `role: ReadOnly`)\n- Object key written by editor creds: `notes/welcome.txt` with body `hello readonly`\n- Object key whose write MUST be denied: `notes/forbidden.txt` (must NOT exist in the fork bucket after the run)\n- Do not hardcode credentials; admin credentials come from environment variables (`TIGRIS_STORAGE_ACCESS_KEY_ID`, `TIGRIS_STORAGE_SECRET_ACCESS_KEY`, `TIGRIS_STORAGE_ENDPOINT`). Scoped credentials are obtained from Agent Kit at runtime.\n- Real Tigris service only — no mocking.\n- Do NOT tear down the workspace or the fork; the verifier will tear them down.\n\n## Integrations\n- Tigris Data (real `https://t3.storage.dev` endpoint via `@tigrisdata/agent-kit` and `@tigrisdata/storage`).\n"])</script><script>self.__next_f.push([1,"1a:T180e,"])</script><script>self.__next_f.push([1,"# Tigris Shadow Bucket: Read-Through Migration from an Origin Bucket\n\n## Background\nTigris supports **zero-downtime migration** from any S3-compatible source via the **shadow bucket** mechanism (see https://www.tigrisdata.com/docs/migration/). When a Tigris bucket is configured with a shadow source, reads for objects that are not yet present in the Tigris bucket are transparently fetched from the shadow source, returned to the caller, and asynchronously copied into the Tigris bucket for future access.\n\nIn this task, both the origin and the shadow are Tigris buckets (Tigris is itself S3-compatible at endpoint `https://t3.storage.dev`), so the entire migration loop is exercised end-to-end without any external AWS dependency.\n\nThe container's entrypoint script has ALREADY pre-seeded the origin bucket BEFORE the agent runs:\n\n- Origin bucket name: `harbor-origin-${trial_id}` (where `${trial_id}` is the content of `/logs/artifacts/trial_id`). Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Pre-seeded object key: `docs/readme.md`\n- Pre-seeded object content (exact bytes, no trailing newline): `from origin`\n\nThe shadow bucket has NOT been created yet. That is your job.\n\n## Requirements\nUsing the `tigris` CLI and the `aws` CLI, do the following:\n\n1. Create a NEW Tigris bucket named EXACTLY `harbor-shadow-${trial_id}` (read the `${trial_id}` from `/logs/artifacts/trial_id`). Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n2. Configure the new bucket so that the **pre-existing** Tigris bucket `harbor-origin-${trial_id}` is its **shadow source**. The shadow source endpoint MUST be `https://t3.storage.dev`, the region MUST be `auto`, and the shadow credentials MUST be the same Tigris credentials provided to the container (`TIGRIS_STORAGE_ACCESS_KEY_ID` / `TIGRIS_STORAGE_SECRET_ACCESS_KEY`). DO NOT enable write-through.\n3. Without ever writing the object `docs/readme.md` directly into the shadow bucket, fetch the object via the shadow bucket using the AWS CLI:\n   ```bash\n   aws s3 cp s3://harbor-shadow-${trial_id}/docs/readme.md /home/user/tigris-task/proxied.md \\\n     --endpoint-url https://t3.storage.dev --region auto\n   ```\n   The shadow bucket must serve the read by proxying it from the origin bucket.\n4. After the proxied read completes, the local file `/home/user/tigris-task/proxied.md` MUST contain exactly the bytes `from origin` (11 bytes, no trailing newline).\n5. Do NOT delete or modify the origin bucket or the origin object. The verifier reads them.\n\n## Implementation Guide\n1. Read the trial id and derive both bucket names:\n   ```bash\n   TRIAL_ID=\"$(cat /logs/artifacts/trial_id)\"\n   ORIGIN=\"harbor-origin-${TRIAL_ID}\"\n   SHADOW=\"harbor-shadow-${TRIAL_ID}\"\n   ```\n2. Create the empty shadow bucket:\n   ```bash\n   tigris buckets create \"$SHADOW\"\n   ```\n3. Configure shadow migration (point the shadow bucket at the origin bucket as its read-through source):\n   ```bash\n   tigris buckets set-migration \"$SHADOW\" \\\n     --bucket \"$ORIGIN\" \\\n     --endpoint https://t3.storage.dev \\\n     --region auto \\\n     --access-key \"$TIGRIS_STORAGE_ACCESS_KEY_ID\" \\\n     --secret-key \"$TIGRIS_STORAGE_SECRET_ACCESS_KEY\"\n   ```\n   Refer to https://www.tigrisdata.com/docs/cli/buckets/set-migration/ for the flag specification.\n4. Confirm the migration configuration is set by inspecting the shadow bucket:\n   ```bash\n   tigris buckets get \"$SHADOW\"\n   ```\n5. Now use the AWS CLI to read the object through the shadow bucket — the object is NOT directly present in the shadow bucket, so the shadow read-through must service the request from the origin:\n   ```bash\n   aws s3 cp \"s3://${SHADOW}/docs/readme.md\" /home/user/tigris-task/proxied.md \\\n     --endpoint-url https://t3.storage.dev --region auto\n   ```\n6. Verify locally that `/home/user/tigris-task/proxied.md` exists and contains EXACTLY the bytes `from origin`.\n\n## Constraints\n- Project path: `/home/user/tigris-task`\n- Output file MUST be at exactly `/home/user/tigris-task/proxied.md`.\n- Origin bucket name MUST be exactly `harbor-origin-${trial_id}` (do NOT recreate or modify it — it is pre-seeded by the container entrypoint). Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Shadow bucket name MUST be exactly `harbor-shadow-${trial_id}` (you create it). Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Shadow source endpoint MUST be `https://t3.storage.dev`; region MUST be `auto`.\n- DO NOT upload `docs/readme.md` (or any object) directly into the shadow bucket via `tigris cp`, `tigris mk`, `aws s3 cp` to the shadow bucket, or any other mechanism — the bytes MUST be served by the shadow read-through from the origin bucket.\n- DO NOT enable write-through mode on the shadow migration configuration.\n- DO NOT delete either bucket; the verifier deletes both during cleanup.\n- The local file `/home/user/tigris-task/proxied.md` MUST contain EXACTLY the bytes `from origin` (11 bytes, no trailing whitespace/newline).\n- The container is pre-wired so that the Tigris CLI and the AWS CLI both authenticate against the Harbor-provided credentials: `/etc/profile.d/tigris-auth.sh` maps `TIGRIS_STORAGE_ACCESS_KEY_ID` / `TIGRIS_STORAGE_SECRET_ACCESS_KEY` onto `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY` / `AWS_REGION=auto`. If you invoke the CLI from a non-login shell, source this file first or pass the AWS_* variables inline.\n\n## Integrations\n- Tigris Object Storage (credentials provided as `TIGRIS_STORAGE_ACCESS_KEY_ID` and `TIGRIS_STORAGE_SECRET_ACCESS_KEY`)."])</script><script>self.__next_f.push([1,"1b:Ted5,"])</script><script>self.__next_f.push([1,"# Tigris Storage SDK PutObject Workflow\n\n## Background\nThe Tigris Storage SDK (`@tigrisdata/storage`) is the native TypeScript SDK for Tigris object storage. It provides functions like `createBucket`, `put`, and `list` that map to the same primitives the plan refers to as `putObject` and `listObjects`. You will use this SDK to programmatically provision a bucket, upload a small inbox of JSON messages, and produce a local listing of the uploaded keys.\n\n## Requirements\n- Write a TypeScript program at `/home/user/tigris-task/index.ts` that uses `@tigrisdata/storage` to:\n  1. Read the current `trial_id` from `/logs/artifacts/trial_id`.\n  2. Build the bucket name as `harbor-tssdk-${trial_id}` (lowercase trial id). Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n  3. Call `createBucket` to create that bucket. If the bucket already exists, treat that as success.\n  4. Call `put` three times to upload the following objects to the bucket, each with `Content-Type: application/json`:\n     - `inbox/msg-1.json` with body `{\"id\": 1}`\n     - `inbox/msg-2.json` with body `{\"id\": 2}`\n     - `inbox/msg-3.json` with body `{\"id\": 3}`\n  5. Call `list` with `{ prefix: \"inbox/\" }` and write the resulting object names (the `name` field of each item, one per line, in any order) to `/home/user/tigris-task/listing.txt`.\n- Run the program with `tsx /home/user/tigris-task/index.ts` (`tsx` is pre-installed globally and as a local dev dependency). Compiling with `tsc` first is also acceptable.\n- The bucket and objects must be created on the real Tigris service using the credentials provided via environment variables (`TIGRIS_STORAGE_ACCESS_KEY_ID`, `TIGRIS_STORAGE_SECRET_ACCESS_KEY`, `TIGRIS_STORAGE_ENDPOINT`). Do not mock the service.\n\n## Implementation Guide\n1. `cd /home/user/tigris-task`\n2. The project is already initialized with a `package.json` that depends on `@tigrisdata/storage` and `tsx`, and dependencies are pre-installed in `node_modules`. A `tsconfig.json` is also provided.\n3. Create `index.ts` with the logic described above. Use ES module imports:\n   ```typescript\n   import { readFile, writeFile } from \"node:fs/promises\";\n   import { createBucket, put, list } from \"@tigrisdata/storage\";\n   ```\n4. Read the trial id with `readFile(\"/logs/artifacts/trial_id\", \"utf-8\")` and `.trim()` it.\n5. For every SDK call, check the returned `{ data, error }` envelope. If `error` is set, ignore it only for `createBucket` when the bucket already exists; otherwise exit non-zero.\n6. Pass `config: { bucket: bucketName }` to each `put` and `list` call so the operations target the new bucket.\n7. After the listing call, join the `name` values of `data.items` with `\\n` and write them to `/home/user/tigris-task/listing.txt`.\n8. Run with `tsx index.ts` and confirm it exits successfully.\n\n## Constraints\n- Project path: /home/user/tigris-task\n- Source file: /home/user/tigris-task/index.ts\n- Listing output file: /home/user/tigris-task/listing.txt\n- Bucket name: `harbor-tssdk-${trial_id}` where `${trial_id}` comes from `/logs/artifacts/trial_id`. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Use only `@tigrisdata/storage` for the bucket creation, upload, and listing steps. Do not shell out to other tools (no `tigris` CLI, no AWS CLI).\n- Do not hardcode credentials; read them from environment variables, which the SDK does automatically.\n\n## Integrations\n- Tigris Data (real `https://t3.storage.dev` endpoint via `@tigrisdata/storage`).\n"])</script><script>self.__next_f.push([1,"1c:Tfcc,"])</script><script>self.__next_f.push([1,"# Tigris Agent Kit: Workspace Lifecycle With Scoped Credentials\n\n## Background\nTigris Agent Kit (`@tigrisdata/agent-kit`) provides a `createWorkspace` primitive that provisions an ephemeral bucket plus a scoped IAM access key. The scoped key is restricted to that single workspace bucket only — leaking the key cannot expose any other data. In this task you will write a TypeScript program that creates such a workspace, then uses the scoped credentials (not the root credentials in the environment) to upload a small state object into the workspace bucket. You will also surface the scoped access key id so the verifier can confirm it is different from the root key.\n\n## Requirements\n- Write a TypeScript program at `/home/user/tigris-task/run.ts` that:\n  1. Reads the current `trial_id` from `/logs/artifacts/trial_id` and `.trim()`s it.\n  2. Builds the workspace name as `harbor-ws-${trial_id}` (use the trial id as-is, no extra normalization).\n  3. Calls `createWorkspace(name, { ttl: { days: 1 }, credentials: { role: \"Editor\" } })` from `@tigrisdata/agent-kit`. If the call returns an error or returns a workspace without `credentials`, exit with a non-zero exit code.\n  4. Using ONLY the scoped credentials returned in `workspace.credentials` (NOT the root `TIGRIS_STORAGE_ACCESS_KEY_ID` / `TIGRIS_STORAGE_SECRET_ACCESS_KEY` env vars), upload a single object with `@tigrisdata/storage`'s `put`:\n     - Key: `state.json`\n     - Body: the exact string `{\"status\":\"ok\",\"run\":\"${trial_id}\"}` (no extra whitespace, with `${trial_id}` substituted).\n     - Content-Type: `application/json`.\n     - Target bucket: `workspace.bucket`.\n     - Pass the scoped credentials explicitly via `config: { bucket, accessKeyId, secretAccessKey }`.\n  5. After a successful upload, print the scoped `workspace.credentials.accessKeyId` to stdout (a single line, no extra prefix) AND also write it to `/home/user/tigris-task/output.log` so it can be inspected after the run.\n- Run the program with `tsx /home/user/tigris-task/run.ts` (`tsx` is installed both globally and as a local dev dependency).\n- All Tigris API calls must hit the real Tigris service via `@tigrisdata/agent-kit` and `@tigrisdata/storage`. Do not mock anything.\n\n## Implementation Guide\n1. `cd /home/user/tigris-task`\n2. The project is already initialized with a `package.json` that depends on `@tigrisdata/agent-kit`, `@tigrisdata/storage`, and `tsx`, and the dependencies are pre-installed in `node_modules`. A `tsconfig.json` is also provided.\n3. Create `run.ts` with the logic described above. Suggested imports:\n   ```typescript\n   import { readFile, writeFile } from \"node:fs/promises\";\n   import { createWorkspace } from \"@tigrisdata/agent-kit\";\n   import { put } from \"@tigrisdata/storage\";\n   ```\n4. For every SDK call, check the returned `{ data, error }` envelope. On any unexpected error, log it and exit non-zero.\n5. Do NOT call `teardownWorkspace` from `run.ts` — the verifier is responsible for tearing down the workspace after it inspects the result.\n6. Run with `tsx run.ts` and confirm it exits with code 0 and prints exactly one line: the scoped access key id (it should start with `tid_`).\n\n## Constraints\n- Project path: /home/user/tigris-task\n- Source file: /home/user/tigris-task/run.ts\n- Log file: /home/user/tigris-task/output.log (must contain the scoped access key id printed by the script)\n- Workspace name: `harbor-ws-${trial_id}` where `${trial_id}` is read from `/logs/artifacts/trial_id`.\n- Object key: `state.json`\n- Object body: exact string `{\"status\":\"ok\",\"run\":\"${trial_id}\"}` (UTF-8, no trailing newline).\n- The upload MUST be performed using the scoped credentials returned by `createWorkspace`. Do not fall back to the root env-var credentials for the upload step.\n- Do not hardcode credentials anywhere; the root credentials are exposed via environment variables and consumed automatically by `@tigrisdata/agent-kit`.\n\n## Integrations\n- Tigris Data (real `https://t3.storage.dev` endpoint via `@tigrisdata/agent-kit` and `@tigrisdata/storage`).\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"TCWgNJP-_Lo03bK7lXgdN\",\"c\":[\"\",\"tasks\",\"\"],\"q\":\"\",\"i\":false,\"f\":[[[\"\",{\"children\":[\"tasks\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],[[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/tigris-benchmark/_next/static/chunks/a1b985bc6c7f369d.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-0\",{\"src\":\"/tigris-benchmark/_next/static/chunks/babff0e7418ab052.js\",\"async\":true,\"nonce\":\"$undefined\"}],[\"$\",\"script\",\"script-1\",{\"src\":\"/tigris-benchmark/_next/static/chunks/3ecbb78a8ff87549.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"suppressHydrationWarning\":true,\"children\":[\"$\",\"body\",null,{\"className\":\"inter_5972bc34-module__OU16Qa__className antialiased\",\"children\":[\"$\",\"$L2\",null,{\"children\":[\"$\",\"$L3\",null,{\"defaultTheme\":\"dark\",\"children\":[[\"$\",\"div\",null,{\"className\":\"fixed right-4 top-6 z-50 sm:top-8\",\"children\":[\"$\",\"$L4\",null,{}]}],[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[[\"$\",\"title\",null,{\"children\":\"404: This page could not be found.\"}],[\"$\",\"div\",null,{\"style\":{\"fontFamily\":\"system-ui,\\\"Segoe UI\\\",Roboto,Helvetica,Arial,sans-serif,\\\"Apple Color Emoji\\\",\\\"Segoe UI Emoji\\\"\",\"height\":\"100vh\",\"textAlign\":\"center\",\"display\":\"flex\",\"flexDirection\":\"column\",\"alignItems\":\"center\",\"justifyContent\":\"center\"},\"children\":[\"$\",\"div\",null,{\"children\":[[\"$\",\"style\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\"body{color:#000;background:#ff
