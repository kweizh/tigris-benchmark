nks/babff0e7418ab052.js\",\"/tigris-benchmark/_next/static/chunks/3ecbb78a8ff87549.js\",\"/tigris-benchmark/_next/static/chunks/777f5ef34b6ca51a.js\",\"/tigris-benchmark/_next/static/chunks/be08138953094657.js\"],\"TasksPageClient\"]\n21:I[9986,[\"/tigris-benchmark/_next/static/chunks/d2c13bb33c4fcd54.js\",\"/tigris-benchmark/_next/static/chunks/c21188132e0e0d48.js\"],\"default\"]\n:HL[\"/tigris-benchmark/_next/static/chunks/a1b985bc6c7f369d.css\",\"style\"]\n:HL[\"/tigris-benchmark/_next/static/media/83afe278b6a6bb3c-s.p.3a6ba036.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n8:Ta3f,"])</script><script>self.__next_f.push([1,"# Upload an Object to Tigris using the AWS CLI\n\n## Background\nTigris is an S3-compatible object storage service exposing a single global endpoint at `https://t3.storage.dev`. Because of its S3 compatibility, the standard `aws` CLI can be used against Tigris by pointing it at the Tigris endpoint and providing Tigris access credentials. In this task you will use the AWS CLI to create a bucket and upload a file to it on Tigris.\n\n## Requirements\n- Use the standard `aws` CLI (already installed) configured to talk to Tigris.\n- Create a Tigris bucket whose name is derived from the trial id.\n- Upload the existing local file `/home/user/tigris-task/hello.txt` (contents: literal text `hello tigris`) to that bucket under the key `hello.txt`.\n\n## Implementation Guide\n1. Read the trial id from `/logs/artifacts/trial_id`.\n2. Construct the bucket name as `harbor-awscli-${trial_id}` (substitute the actual id; do NOT keep the `${trial_id}` placeholder literal). Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n3. Use the AWS CLI against the Tigris endpoint to create the bucket, for example:\n   ```bash\n   aws s3 mb s3://harbor-awscli-${trial_id}\n   ```\n4. Upload the pre-existing file `/home/user/tigris-task/hello.txt` to the bucket:\n   ```bash\n   aws s3 cp /home/user/tigris-task/hello.txt s3://harbor-awscli-${trial_id}/hello.txt\n   ```\n5. Confirm the object is listed by running `aws s3 ls s3://harbor-awscli-${trial_id}/`.\n\n## Constraints\n- Project path: /home/user/tigris-task\n- Pre-existing file: /home/user/tigris-task/hello.txt (contains exactly the bytes `hello tigris`, no trailing newline). Do NOT modify its contents.\n- Bucket name format: `harbor-awscli-${trial_id}` where `${trial_id}` is read from `/logs/artifacts/trial_id`. You must normalize the bucket name to only contain lowercase letters, numbers, dots, and hyphens. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- The AWS CLI is pre-configured via the environment variables `AWS_ENDPOINT_URL_S3=https://t3.storage.dev`, `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, and `AWS_REGION=auto`. Do NOT hardcode credentials in any file.\n- Use the real Tigris service. Do NOT mock or stub any of the calls.\n\n## Integrations\n- Tigris (object storage, accessed via the AWS S3 protocol on `https://t3.storage.dev`)"])</script><script>self.__next_f.push([1,"9:T10c5,"])</script><script>self.__next_f.push([1,"# boto3 Object Roundtrip Against Tigris\n\n## Background\nTigris is an S3-compatible, globally distributed object storage service exposed at the single endpoint `https://t3.storage.dev`. Because Tigris is S3 compatible, you can use the AWS SDK for Python (boto3) without modification — you only need to point boto3 at the Tigris endpoint and use the standard virtual-hosted addressing style. The Harbor runtime injects the Tigris credentials and endpoint into the container as the AWS-flavored environment variables `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `AWS_ENDPOINT_URL_S3`, and `AWS_REGION` so boto3 can pick them up automatically.\n\n## Requirements\nWrite a single Python script at `/home/user/tigris-task/roundtrip.py` that uses **boto3** (no shelling out to other CLIs) to perform a full object roundtrip against Tigris:\n\n1. Read the trial identifier from `/logs/artifacts/trial_id` (strip surrounding whitespace) and derive the bucket name `harbor-boto3-${trial_id}`. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n2. Create a boto3 S3 client pointed at the Tigris endpoint. Use the value of the `AWS_ENDPOINT_URL_S3` environment variable as the endpoint URL (this is set to `https://t3.storage.dev` by the runtime). Configure `Config(s3={\"addressing_style\": \"virtual\"})`.\n3. Create the bucket `harbor-boto3-${trial_id}` (idempotently — if it already exists and is owned by the caller, treat that as success).\n4. Upload the bytes of the JSON payload `{\"hello\":\"tigris\"}` (exactly that string, no extra whitespace, no trailing newline) under the object key `data/payload.json`.\n5. Download the object back **into memory** (e.g. with `get_object` and reading the `Body` stream) and write the downloaded bytes verbatim to `/home/user/tigris-task/downloaded.json`.\n6. Exit with status 0 on success.\n\nThen execute the script once from `/home/user/tigris-task` so that the bucket, the object, and `/home/user/tigris-task/downloaded.json` all exist before verification runs.\n\n## Implementation Guide\n1. `cd /home/user/tigris-task`.\n2. Create `roundtrip.py`. A minimal sketch:\n   ```python\n   import json, os, pathlib, boto3\n   from botocore.client import Config\n\n   trial_id = pathlib.Path(\"/logs/artifacts/trial_id\").read_text().strip()\n   bucket = f\"harbor-boto3-{trial_id}\"\n   key = \"data/payload.json\"\n   payload = b'{\"hello\":\"tigris\"}'\n\n   s3 = boto3.client(\n       \"s3\",\n       endpoint_url=os.environ[\"AWS_ENDPOINT_URL_S3\"],\n       config=Config(s3={\"addressing_style\": \"virtual\"}),\n   )\n\n   try:\n       s3.create_bucket(Bucket=bucket)\n   except s3.exceptions.BucketAlreadyOwnedByYou:\n       pass\n\n   s3.put_object(Bucket=bucket, Key=key, Body=payload)\n   downloaded = s3.get_object(Bucket=bucket, Key=key)[\"Body\"].read()\n   pathlib.Path(\"/home/user/tigris-task/downloaded.json\").write_bytes(downloaded)\n   ```\n3. Run it: `python3 /home/user/tigris-task/roundtrip.py`.\n\n## Constraints\n- Project path: `/home/user/tigris-task`\n- Script path: `/home/user/tigris-task/roundtrip.py`\n- Downloaded artifact: `/home/user/tigris-task/downloaded.json`\n- Object key MUST be exactly `data/payload.json`.\n- Object body MUST be exactly the 18 bytes `{\"hello\":\"tigris\"}` (no extra whitespace, no newline).\n- Bucket name MUST be derived from `/logs/artifacts/trial_id` as `harbor-boto3-${trial_id}` — do NOT hardcode the trial id. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Use boto3 for ALL S3 operations. Do not shell out to AWS CLI, `tigris`, `curl`, etc.\n- Do NOT hardcode credentials or the endpoint URL inside the script — read them from the standard `AWS_*` environment variables that Harbor injects.\n\n## Integrations\n- Tigris Object Storage. Harbor injects `TIGRIS_STORAGE_ACCESS_KEY_ID` / `TIGRIS_STORAGE_SECRET_ACCESS_KEY` / `TIGRIS_STORAGE_ENDPOINT` and the task runtime maps them onto the boto3-friendly `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `AWS_ENDPOINT_URL_S3` (= `https://t3.storage.dev`), and `AWS_REGION=auto`."])</script><script>self.__next_f.push([1,"a:T946,"])</script><script>self.__next_f.push([1,"# Create a Snapshot-Enabled Tigris Bucket via CLI\n\n## Background\nTigris is a globally distributed, S3-compatible object storage service. Snapshots and forks are opt-in features that must be enabled at bucket creation time — they cannot be turned on later. The Tigris CLI exposes the `--enable-snapshots` flag on `tigris buckets create` for exactly this purpose. In this task you will use the Tigris CLI to create a brand-new bucket with snapshots enabled in a single command.\n\n## Requirements\n- Use the Tigris CLI (`tigris`) to create exactly one new bucket on the real Tigris service (`https://t3.storage.dev`).\n- The bucket name MUST be `harbor-snap-${trial_id}`, where `${trial_id}` is the contents of `/logs/artifacts/trial_id`. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Snapshots MUST be enabled on the bucket at creation time (in the same command — snapshots cannot be enabled later).\n- Do NOT upload any objects to the bucket. Just create it.\n\n## Implementation Guide\n1. Read the trial id:\n   ```bash\n   TRIAL_ID=\"$(cat /logs/artifacts/trial_id)\"\n   BUCKET=\"harbor-snap-${TRIAL_ID}\"\n   ```\n2. The Tigris CLI is already installed and the following environment variables are pre-populated for machine authentication (do NOT run `tigris login`, which would try to open a browser):\n   - `TIGRIS_STORAGE_ACCESS_KEY_ID`\n   - `TIGRIS_STORAGE_SECRET_ACCESS_KEY`\n   - `TIGRIS_STORAGE_ENDPOINT` (set to `https://t3.storage.dev`)\n3. Create the snapshot-enabled bucket in a single CLI invocation:\n   ```bash\n   tigris buckets create \"$BUCKET\" --enable-snapshots\n   ```\n4. (Optional) Confirm it landed by running `tigris buckets list --format json` and looking for the new bucket name.\n\n## Constraints\n- Project path: `/home/user/tigris-task`\n- Do NOT hardcode credentials. Use only the env vars listed above.\n- Do NOT call `tigris login` — credentials are picked up from the environment automatically.\n- The bucket name MUST include the `trial_id` suffix derived from `/logs/artifacts/trial_id` so it is unique per run.\n- Snapshots MUST be enabled in the same `tigris buckets create` command (they cannot be enabled on an existing bucket).\n\n## Integrations\n- Tigris (`https://t3.storage.dev`)"])</script><script>self.__next_f.push([1,"b:T1191,"])</script><script>self.__next_f.push([1,"# Tigris Storage SDK: Bucket-to-Bucket Object Copy\n\n## Background\nTigris is a globally distributed, S3-compatible object storage service. The native TypeScript SDK `@tigrisdata/storage` exposes primitives (`createBucket`, `list`, `get`, `put`) that map to the same concepts the plan refers to as `listObjects`, `getObject`, and `putObject`. A common workflow for an AI agent is to copy a curated set of objects out of a source bucket into a brand-new destination bucket, preserving the keys and content exactly.\n\nThe container's entrypoint has already pre-seeded a source bucket BEFORE the agent starts:\n\n- Source bucket: `harbor-src-${trial_id}` (where `${trial_id}` is the content of `/logs/artifacts/trial_id`).\n- Five JSON objects under the `data/` prefix, with keys `data/01.json` ... `data/05.json`.\n- Each object's body is the JSON document `{\"index\": N, \"payload\": \"\u003cN concatenated copies of the word foo\u003e\"}` for N = 1..5. No trailing whitespace, no trailing newline.\n  - `data/01.json` body: `{\"index\": 1, \"payload\": \"foo\"}`\n  - `data/02.json` body: `{\"index\": 2, \"payload\": \"foofoo\"}`\n  - `data/03.json` body: `{\"index\": 3, \"payload\": \"foofoofoo\"}`\n  - `data/04.json` body: `{\"index\": 4, \"payload\": \"foofoofoofoo\"}`\n  - `data/05.json` body: `{\"index\": 5, \"payload\": \"foofoofoofoofoo\"}`\n\nYour job is to write and run a TypeScript program that uses the Tigris Storage SDK to create a fresh destination bucket and copy every object under `data/` into it, preserving keys and bytes.\n\n## Requirements\nUsing only the `@tigrisdata/storage` SDK from a TypeScript program at `/home/user/tigris-task/copy.ts`, do the following:\n\n1. Read the current `trial_id` from `/logs/artifacts/trial_id` (trim whitespace).\n2. Compute the bucket names exactly:\n   - `srcBucket = harbor-src-${trial_id}`\n   - `dstBucket = harbor-dst-${trial_id}`\n3. Call `createBucket(dstBucket)` to provision the destination bucket. If it already exists, treat that as success.\n4. Call `list({ prefix: \"data/\", config: { bucket: srcBucket } })` to enumerate the seeded objects.\n5. For every item returned, call `get(name, \"string\", { config: { bucket: srcBucket } })` to retrieve the body, then `put(name, body, { config: { bucket: dstBucket } })` to write the same key into the destination bucket. The destination object body must equal the source object body byte-for-byte.\n6. Do NOT modify, rename, or delete any object in the source bucket. The verifier asserts the source is unchanged.\n7. Run the program with `tsx /home/user/tigris-task/copy.ts`. Compiling first with `tsc` is also acceptable.\n\n## Implementation Guide\n1. `cd /home/user/tigris-task`\n2. The project is already initialized with a `package.json` that depends on `@tigrisdata/storage` and `tsx`, and dependencies are pre-installed in `node_modules`. A `tsconfig.json` is also provided.\n3. Create `copy.ts` with ES module imports:\n   ```typescript\n   import { readFile } from \"node:fs/promises\";\n   import { createBucket, list, get, put } from \"@tigrisdata/storage\";\n   ```\n4. Read the trial id with `await readFile(\"/logs/artifacts/trial_id\", \"utf-8\")` and `.trim()` it.\n5. For every SDK call, check the returned `{ data, error }` envelope. If `error` is set on a call other than `createBucket(dstBucket)` (where an \"already exists\" error must be ignored), exit non-zero.\n6. Pass `config: { bucket: ... }` to every `list`, `get`, and `put` call so the operations target the correct bucket.\n7. Run with `tsx copy.ts` and confirm the program exits successfully.\n\n## Constraints\n- Project path: `/home/user/tigris-task`\n- Source file: `/home/user/tigris-task/copy.ts`\n- Source bucket: `harbor-src-${trial_id}` (must NOT be modified)\n- Destination bucket: `harbor-dst-${trial_id}` (must be created by the agent)\n- The destination bucket must contain EXACTLY the five keys `data/01.json` through `data/05.json` under the `data/` prefix, each with the exact JSON body listed above.\n- Use only `@tigrisdata/storage` for bucket creation, listing, downloading, and uploading. Do not shell out to other tools (no `tigris` CLI, no AWS CLI, no `s3cmd`, etc.).\n- Do not hardcode credentials; the SDK reads them from environment variables.\n- Do not delete the source or destination bucket; the verifier cleans both up after assertions.\n\n## Integrations\n- Tigris Object Storage (real `https://t3.storage.dev` endpoint via `@tigrisdata/storage`). Credentials are exposed via `TIGRIS_STORAGE_ACCESS_KEY_ID`, `TIGRIS_STORAGE_SECRET_ACCESS_KEY`, and `TIGRIS_STORAGE_ENDPOINT`.\n"])</script><script>self.__next_f.push([1,"c:Tcbf,"])</script><script>self.__next_f.push([1,"# Tigris CLI: Apply a 7-Day Object Expiration TTL to a Bucket\n\n## Background\nTigris buckets can be configured with an object expiration TTL so that objects are automatically deleted after a fixed number of days. This is a common requirement for ephemeral evaluation buckets that should not accumulate state indefinitely. The Tigris CLI (`@tigrisdata/cli`) exposes this as the `tigris buckets set-ttl` subcommand (documented at https://www.tigrisdata.com/docs/cli/buckets/set-ttl/), which configures bucket-level object expiration in days or to a specific date.\n\n## Requirements\n- Read the Harbor trial identifier from `/logs/artifacts/trial_id` and use it to derive a unique bucket name `harbor-ttl-${trial_id}`. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Create that bucket using the Tigris CLI.\n- Configure the bucket's object expiration TTL to 7 days using the documented Tigris CLI subcommand `tigris buckets set-ttl`.\n- The bucket configuration returned by `tigris buckets get \u003cbucket\u003e --format json` must reflect that the 7-day TTL is in effect.\n\n## Implementation Guide\n1. Open a terminal in the project directory `/home/user/ttl-task`.\n2. Read the trial id from `/logs/artifacts/trial_id` and trim any trailing whitespace.\n3. Derive the bucket name as `harbor-ttl-${trial_id}`. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n4. Create the bucket with:\n   ```bash\n   tigris buckets create harbor-ttl-${trial_id}\n   ```\n5. Apply the 7-day expiration TTL with the documented subcommand:\n   ```bash\n   tigris buckets set-ttl harbor-ttl-${trial_id} --days 7\n   ```\n6. The container's login shell is pre-wired to expose the Tigris credentials to the CLI: `/etc/profile.d/tigris-auth.sh` maps `TIGRIS_STORAGE_ACCESS_KEY_ID`/`TIGRIS_STORAGE_SECRET_ACCESS_KEY` to the AWS-compatible variables (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `AWS_REGION=auto`) consumed by the `tigris` CLI. If you invoke `tigris` from a non-login shell, source this file first or pass the AWS_* variables inline.\n\n## Constraints\n- Project path: `/home/user/ttl-task`\n- Bucket name MUST be exactly `harbor-ttl-${trial_id}` where `${trial_id}` is the contents of `/logs/artifacts/trial_id` (trimmed of trailing whitespace). Do NOT hardcode any other suffix. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- TTL MUST be exactly 7 days. Use `--days 7`.\n- Use the Tigris CLI (`@tigrisdata/cli`) only — do not configure TTL via raw S3/HTTP, the AWS CLI, or any other tool.\n- The bucket must remain provisioned after the task completes so the verifier can inspect it. The verifier will delete the bucket after assertions.\n\n## Integrations\n- Tigris Object Storage (credentials provided as `TIGRIS_STORAGE_ACCESS_KEY_ID` and `TIGRIS_STORAGE_SECRET_ACCESS_KEY`)."])</script><script>self.__next_f.push([1,"d:T18eb,"])</script><script>self.__next_f.push([1,"# Tigris (boto3): Bulk Concurrent Object Upload\n\n## Background\nTigris is an S3-compatible object storage service reachable at the global endpoint `https://t3.storage.dev`. Because Tigris speaks S3 natively, you can use the standard AWS Python SDK ([boto3](https://www.tigrisdata.com/docs/sdks/s3/aws-python-sdk/)) against it by pointing the client at the Tigris endpoint with virtual-hosted addressing style.\n\nIn this task you will exercise a realistic AI-pipeline pattern: writing many small JSON event records into object storage *in parallel*, measuring how long the burst takes, and persisting that measurement so a downstream system can audit throughput.\n\n## Requirements\nWrite a Python program at `/home/user/tigris-task/bulk.py`. When executed with `python3 /home/user/tigris-task/bulk.py` it MUST:\n\n1. Read the current trial id from `/logs/artifacts/trial_id` (newline-trimmed) and compute the bucket name `harbor-bulk-${trial_id}`. Do NOT hardcode the suffix. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n2. Build a boto3 S3 client whose `endpoint_url` is `https://t3.storage.dev` (the `AWS_ENDPOINT_URL_S3` env var is also exported to this exact value, so you may read it from the environment) and whose `Config` sets `s3={'addressing_style': 'virtual'}`. The client MUST authenticate with `TIGRIS_STORAGE_ACCESS_KEY_ID` and `TIGRIS_STORAGE_SECRET_ACCESS_KEY` from the environment (you may either pass them explicitly to `boto3.client` or first re-export them as `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY`).\n3. Create the bucket `harbor-bulk-${trial_id}` (treat \"already exists / owned by you\" as success).\n4. Upload **exactly 20** JSON objects **in parallel** using `concurrent.futures.ThreadPoolExecutor(max_workers=10)`. For each integer `N` in `1..20`:\n   - Compute `N_str = format(N, '03d')` (i.e. `\"001\"`, `\"002\"`, ..., `\"020\"`).\n   - Object key: `events/event-${N_str}.json` (e.g. `events/event-001.json`).\n   - Object body: the JSON document `{\"id\": \"\u003cN_str\u003e\", \"ts\": \"2024-01-01\"}` encoded as UTF-8 bytes, where `\u003cN_str\u003e` is the same zero-padded 3-digit string used in the key (e.g. `{\"id\": \"001\", \"ts\": \"2024-01-01\"}`).\n5. Measure the wall-clock duration of the parallel upload phase (from just before submitting the futures to just after the executor finishes / all results have been collected) in **milliseconds**, then write that measurement as a single base-10 integer (no units, no JSON wrapping) to `/home/user/tigris-task/timing.txt`. The integer MUST be `\u003e= 1`.\n6. Exit with code 0 only after the bucket has been created and all 20 uploads have completed successfully.\n\nDo NOT delete any object or the bucket -- the verifier will inspect them and then clean up.\n\n## Implementation Guide\n1. Inspect `/logs/artifacts/trial_id` and use the contents (stripped) to form the bucket name `harbor-bulk-${trial_id}`. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n2. Create `/home/user/tigris-task/bulk.py` with logic similar to the snippet below:\n   ```python\n   import json, os, time\n   from concurrent.futures import ThreadPoolExecutor\n   import boto3\n   from botocore.client import Config\n\n   trial_id = open(\"/logs/artifacts/trial_id\").read().strip()\n   bucket = f\"harbor-bulk-{trial_id}\"\n\n   client = boto3.client(\n       \"s3\",\n       endpoint_url=os.environ.get(\"AWS_ENDPOINT_URL_S3\", \"https://t3.storage.dev\"),\n       aws_access_key_id=os.environ[\"TIGRIS_STORAGE_ACCESS_KEY_ID\"],\n       aws_secret_access_key=os.environ[\"TIGRIS_STORAGE_SECRET_ACCESS_KEY\"],\n       region_name=\"auto\",\n       config=Config(s3={\"addressing_style\": \"virtual\"}),\n   )\n\n   try:\n       client.create_bucket(Bucket=bucket)\n   except client.exceptions.BucketAlreadyOwnedByYou:\n       pass\n   except client.exceptions.BucketAlreadyExists:\n       pass\n\n   def upload(n):\n       n_str = format(n, \"03d\")\n       body = json.dumps({\"id\": n_str, \"ts\": \"2024-01-01\"}).encode(\"utf-8\")\n       client.put_object(Bucket=bucket, Key=f\"events/event-{n_str}.json\", Body=body)\n\n   start = time.monotonic()\n   with ThreadPoolExecutor(max_workers=10) as ex:\n       list(ex.map(upload, range(1, 21)))\n   duration_ms = max(1, int((time.monotonic() - start) * 1000))\n\n   with open(\"/home/user/tigris-task/timing.txt\", \"w\") as f:\n       f.write(str(duration_ms))\n   ```\n3. Run the script:\n   ```bash\n   python3 /home/user/tigris-task/bulk.py\n   ```\n4. Sanity check before declaring done: `cat /home/user/tigris-task/timing.txt` should print a positive integer.\n\n## Constraints\n- Project path: `/home/user/tigris-task`\n- Script path (MUST exist after the task): `/home/user/tigris-task/bulk.py`\n- Timing file (MUST exist after the task): `/home/user/tigris-task/timing.txt` containing a single positive base-10 integer (milliseconds).\n- Bucket name MUST be exactly `harbor-bulk-${trial_id}` where `${trial_id}` is the stripped content of `/logs/artifacts/trial_id`. Do NOT hardcode the suffix. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Use `boto3` and `concurrent.futures.ThreadPoolExecutor(max_workers=10)` -- do NOT serialize the uploads, do NOT use the `tigris` CLI for the uploads, and do NOT use multiprocessing or asyncio.\n- Exactly 20 objects under the `events/` prefix: keys `events/event-001.json` ... `events/event-020.json`. No extra objects, no missing objects.\n- Each object body MUST be the UTF-8 JSON `{\"id\": \"\u003cNNN\u003e\", \"ts\": \"2024-01-01\"}` where `\u003cNNN\u003e` matches the key (e.g. `events/event-007.json` must contain `{\"id\": \"007\", \"ts\": \"2024-01-01\"}`).\n- Do NOT delete any object or the bucket; the verifier owns cleanup.\n- Do NOT hardcode credentials -- read them from `TIGRIS_STORAGE_ACCESS_KEY_ID` / `TIGRIS_STORAGE_SECRET_ACCESS_KEY` at runtime.\n\n## Integrations\n- Tigris Object Storage (credentials provided as `TIGRIS_STORAGE_ACCESS_KEY_ID` and `TIGRIS_STORAGE_SECRET_ACCESS_KEY`; endpoint provided as `AWS_ENDPOINT_URL_S3=https://t3.storage.dev`)."])</script><script>self.__next_f.push([1,"e:T1306,"])</script><script>self.__next_f.push([1,"# Tigris Agent Kit: Checkpoint, Mutate, then Restore Into a Fork\n\n## Background\nTigris Agent Kit (`@tigrisdata/agent-kit`) exposes copy-on-write **checkpoints** and **restores** for object buckets. A checkpoint captures a bucket's state at a single point in time; `restore` materializes that captured state into a brand-new fork bucket without touching the source. This is how AI agents \"roll back\" a sandbox to a known-good state for re-evaluation while leaving the live data untouched.\n\nThe container already has a base bucket `harbor-base-${trial_id}` provisioned with snapshots enabled, pre-seeded by the entrypoint with two objects:\n- `data/v1.txt` whose content is exactly `version1`\n- `data/v2.txt` whose content is exactly `version2`\n\nYour task is to (1) checkpoint that base bucket, (2) write a new object `data/v3.txt` (content `version3`) into the base bucket *after* the checkpoint, and (3) restore the checkpoint into a fresh fork bucket named `harbor-restore-${trial_id}`. The fork must reflect the state *before* `data/v3.txt` was added. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n\n## Requirements\n- Implement everything in a single TypeScript script at `/home/user/tigris-task/run.ts`.\n- Use `@tigrisdata/agent-kit` for `checkpoint` and `restore`.\n- Use `@tigrisdata/storage` (`put`) to upload `data/v3.txt`.\n- Execute the script with `tsx /home/user/tigris-task/run.ts`. The script must exit with code 0 on success.\n\n## Implementation Guide\n1. Read the trial id from `/logs/artifacts/trial_id` and `.trim()` it. Build:\n   - `baseBucket = harbor-base-${trial_id}`\n   - `forkBucket = harbor-restore-${trial_id}`\n2. Import the SDK symbols:\n   ```typescript\n   import { readFile } from \"node:fs/promises\";\n   import { checkpoint, restore } from \"@tigrisdata/agent-kit\";\n   import { put } from \"@tigrisdata/storage\";\n   ```\n3. **Step A — Take the checkpoint BEFORE writing `v3.txt`:**\n   ```typescript\n   const { data: ckpt, error: ckptErr } = await checkpoint(baseBucket, { name: \"before-eval\" });\n   if (ckptErr) throw ckptErr;\n   const snapshotId = ckpt.snapshotId;\n   ```\n4. **Step B — Write `data/v3.txt` to the base bucket after the checkpoint:**\n   ```typescript\n   const { error: putErr } = await put(\"data/v3.txt\", \"version3\", {\n     config: { bucket: baseBucket },\n     contentType: \"text/plain\",\n   });\n   if (putErr) throw putErr;\n   ```\n5. **Step C — Restore the checkpoint into the fork bucket:**\n   ```typescript\n   const { data: restored, error: restoreErr } = await restore(baseBucket, snapshotId, {\n     forkName: forkBucket,\n   });\n   if (restoreErr) throw restoreErr;\n   if (restored.bucket !== forkBucket) {\n     throw new Error(`unexpected restored bucket: ${restored.bucket}`);\n   }\n   ```\n6. Optionally write `${snapshotId}` to `/home/user/tigris-task/snapshot-id.txt` for your own bookkeeping (not required for grading).\n7. Run the script:\n   ```bash\n   cd /home/user/tigris-task \u0026\u0026 tsx run.ts\n   ```\n   The order matters: **checkpoint → upload v3.txt → restore**. If you write `v3.txt` before the checkpoint, the fork will contain three objects and the task will fail.\n\n## Constraints\n- Project path: `/home/user/tigris-task`\n- Source file: `/home/user/tigris-task/run.ts`\n- Base bucket name: `harbor-base-${trial_id}` (pre-seeded by the entrypoint with snapshots enabled and the two `data/v*.txt` objects). Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Fork bucket name: `harbor-restore-${trial_id}` (created by your `restore` call — must not pre-exist). Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- The fork bucket must contain EXACTLY the two pre-seeded objects (`data/v1.txt`, `data/v2.txt`). It MUST NOT contain `data/v3.txt`, because the checkpoint was taken before the upload.\n- The base bucket must still contain all three objects (`data/v1.txt`, `data/v2.txt`, `data/v3.txt`) at the end.\n- Use only `@tigrisdata/agent-kit` and `@tigrisdata/storage` for the checkpoint/restore/upload work. Do not shell out to the Tigris CLI for these operations.\n- Do not hardcode credentials — `TIGRIS_STORAGE_ACCESS_KEY_ID`, `TIGRIS_STORAGE_SECRET_ACCESS_KEY`, and `TIGRIS_STORAGE_ENDPOINT` are pre-populated in the environment and read automatically by the SDKs.\n\n## Integrations\n- Tigris Data (real `https://t3.storage.dev` endpoint via `@tigrisdata/agent-kit` and `@tigrisdata/storage`).\n"])</script><script>self.__next_f.push([1,"f:T10d1,"])</script><script>self.__next_f.push([1,"# List Bucket Snapshots with the Tigris CLI\n\n## Background\nThe Tigris CLI (`@tigrisdata/cli`) gives you a `tigris snapshots list \u003cbucket\u003e` command that prints every point-in-time snapshot of a snapshot-enabled bucket. Each snapshot has a unique numeric `version` (a UNIX nanosecond-precision timestamp) that identifies it across the Tigris control plane.\n\nFor this task an operator has pre-populated a snapshot-enabled bucket named `harbor-history-${trial_id}` (where `${trial_id}` is the content of `/logs/artifacts/trial_id`) with several snapshots, but the bucket has to be prepared at task start (the Docker build did not have credentials). A helper script `/home/user/snapshot-list/setup.sh` is already on disk — it reads the admin Tigris credentials from the environment, creates the bucket with snapshots enabled, and takes a fixed sequence of named snapshots. You must run that script first, then list the snapshots with the CLI and persist their IDs (versions) to a text file in chronological order.\n\n## Requirements\n1. Run the helper `bash /home/user/snapshot-list/setup.sh` to create the bucket and pre-populate it with snapshots. The script is idempotent and must complete successfully (exit status 0).\n2. Use the Tigris CLI to list every snapshot of the bucket. Derive the bucket name as `harbor-history-${trial_id}` (substitute the actual trial id from `/logs/artifacts/trial_id`). Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens. Use `tigris snapshots list \u003cbucket_name\u003e --format json` so you can parse the output reliably.\n3. Extract the `version` field of every snapshot and write the values to `/home/user/snapshot-list/snapshots.txt`, one snapshot version per line, in **chronological order (oldest first)**. The Tigris API returns snapshots in reverse-chronological order by default — you must reverse them.\n4. The file `/home/user/snapshot-list/snapshots.txt` must end with a trailing newline, must not contain blank lines, must not contain any header, JSON, or whitespace around the IDs.\n5. Capture all stdout and stderr from your commands to `/home/user/snapshot-list/output.log` for debugging.\n\n## Implementation Guide\n1. Change into the project directory: `cd /home/user/snapshot-list`.\n2. Execute the setup script and capture its output: `bash setup.sh \u003e\u003eoutput.log 2\u003e\u00261`.\n3. Configure the Tigris CLI to use the admin credentials provided by the environment if it has not been configured yet (the helper script already does this):\n   ```bash\n   tigris configure --access-key \"$TIGRIS_STORAGE_ACCESS_KEY_ID\" --access-secret \"$TIGRIS_STORAGE_SECRET_ACCESS_KEY\" \u003e\u003eoutput.log 2\u003e\u00261\n   ```\n4. List the snapshots and produce the file. Example using `jq` (already installed):\n   ```bash\n   tigris snapshots list \u003cbucket_name\u003e --format json \\\n     | jq -r '.snapshots | reverse | .[].version' \u003esnapshots.txt\n   ```\n   Other approaches are fine as long as the resulting `snapshots.txt` has the IDs one per line in chronological order.\n5. Verify your output with `cat snapshots.txt` — every line must be a numeric snapshot version, with the oldest snapshot at the top and the most recent at the bottom.\n\n## Constraints\n- Project path: `/home/user/snapshot-list`\n- Log file: `/home/user/snapshot-list/output.log`\n- Bucket name MUST be derived from `/logs/artifacts/trial_id` as `harbor-history-${trial_id}`. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Output file (fixed): `/home/user/snapshot-list/snapshots.txt`\n- Do not edit `/home/user/snapshot-list/setup.sh` — you may only execute it.\n- Use the real Tigris CLI (`tigris snapshots list`) against the live Tigris service — do not mock or stub the output.\n- The admin credentials are available as `TIGRIS_STORAGE_ACCESS_KEY_ID` and `TIGRIS_STORAGE_SECRET_ACCESS_KEY` environment variables.\n\n## Integrations\n- Tigris (real `@tigrisdata/cli` and the live Tigris control plane; admin credentials supplied via `TIGRIS_STORAGE_ACCESS_KEY_ID` and `TIGRIS_STORAGE_SECRET_ACCESS_KEY`)."])</script><script>self.__next_f.push([1,"10:Te6b,"])</script><script>self.__next_f.push([1,"# Tigris CLI: Upload Objects Under Two Prefixes and Capture a Prefix Listing\n\n## Background\nTigris is an object storage service. The `tigris` CLI (`@tigrisdata/cli`) supports S3-style upload (`tigris cp`) and prefix-scoped listing (`tigris ls t3://\u003cbucket\u003e/\u003cprefix\u003e/`). A common agent workflow is to organize objects under prefixes (e.g., `logs/` for runtime traces, `data/` for inputs) and then inspect only one prefix at a time so the agent can focus on the relevant slice of the bucket.\n\n## Requirements\nUsing the `tigris` CLI exclusively, do the following in order:\n\n1. Read the current `trial_id` from `/logs/artifacts/trial_id`. The bucket name MUST be exactly `harbor-prefix-${trial_id}` — do NOT hardcode any other suffix. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n2. Create a new Tigris bucket named `harbor-prefix-${trial_id}`. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n3. Upload the three pre-existing files into the bucket as follows:\n   - `/home/user/tigris-task/a.txt` → `t3://harbor-prefix-${trial_id}/logs/a.txt`\n   - `/home/user/tigris-task/b.txt` → `t3://harbor-prefix-${trial_id}/logs/b.txt`\n   - `/home/user/tigris-task/c.txt` → `t3://harbor-prefix-${trial_id}/data/c.txt`\n4. Run `tigris ls t3://harbor-prefix-${trial_id}/logs/` and save the FULL stdout of that command to `/home/user/tigris-task/logs-listing.txt` (overwrite if it already exists).\n\nDo NOT delete the bucket — the verifier inspects the bucket state and tears it down itself.\n\n## Implementation Guide\n1. Open a terminal in the project directory `/home/user/tigris-task`.\n2. Determine the trial id, then create the bucket:\n   ```bash\n   TRIAL_ID=\"$(cat /logs/artifacts/trial_id)\"\n   BUCKET=\"harbor-prefix-${TRIAL_ID}\"\n   tigris buckets create \"$BUCKET\"\n   ```\n3. Upload the three files with `tigris cp` using the exact prefix paths shown above.\n4. Capture the prefix listing:\n   ```bash\n   tigris ls \"t3://${BUCKET}/logs/\" \u003e /home/user/tigris-task/logs-listing.txt\n   ```\n5. The container is pre-wired to expose the Tigris credentials to the CLI: `/etc/profile.d/tigris-auth.sh` maps `TIGRIS_STORAGE_ACCESS_KEY_ID`/`TIGRIS_STORAGE_SECRET_ACCESS_KEY` to the AWS-compatible variables (`AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `AWS_REGION=auto`) that the `tigris` CLI consumes. If you invoke `tigris` from a non-login shell, source this file first or pass the AWS_* variables inline.\n\n## Constraints\n- Project path: `/home/user/tigris-task`\n- Bucket name MUST be exactly `harbor-prefix-${trial_id}` where `${trial_id}` is read from `/logs/artifacts/trial_id`. Do NOT hardcode the suffix. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Use the Tigris CLI (`@tigrisdata/cli`) only — do not implement uploads via raw S3/HTTP calls or other SDKs.\n- Do NOT modify the contents of `/home/user/tigris-task/a.txt`, `b.txt`, or `c.txt` — upload them as-is.\n- Do NOT delete the bucket; the verifier asserts on the bucket state and cleans up afterwards.\n- Output file MUST be at exactly `/home/user/tigris-task/logs-listing.txt`.\n\n## Integrations\n- Tigris Object Storage (credentials provided as `TIGRIS_STORAGE_ACCESS_KEY_ID` and `TIGRIS_STORAGE_SECRET_ACCESS_KEY`)."])</script><script>self.__next_f.push([1,"11:T1660,"])</script><script>self.__next_f.push([1,"# Tigris CLI ↔ SDK Interop: Provision a Bucket and Upload a Manifest\n\n## Background\nThis task exercises the interoperability between the Tigris CLI (`@tigrisdata/cli`) and the Tigris Storage SDK (`@tigrisdata/storage`). A common real-world pattern is to use the CLI to provision and configure a bucket as part of infrastructure setup, then use the SDK from application code to read and write objects. Snapshots and TTLs are bucket-level features that must be configured at the CLI/control-plane layer; object upload is data-plane and ergonomic from the SDK.\n\nYou will:\n1. Use the Tigris CLI to create a brand new bucket with snapshots enabled (snapshots MUST be enabled at creation time — they cannot be turned on later).\n2. Use the Tigris CLI again to set the bucket's object-expiration TTL to 7 days.\n3. Write a TypeScript program that uses the `@tigrisdata/storage` SDK to upload an object named `manifest.json` to that bucket.\n4. Use the Tigris CLI a final time to list the bucket contents and persist the listing to disk.\n\n## Requirements\n- Read the current `trial_id` from `/logs/artifacts/trial_id` and trim trailing whitespace.\n- Derive the bucket name as `harbor-interop-${trial_id}` and use that name verbatim everywhere. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Step 1 (CLI): create the bucket with snapshots enabled in a single `tigris buckets create` invocation that includes `--enable-snapshots`.\n- Step 2 (CLI): set the object expiration TTL on that bucket to exactly 7 days using `tigris buckets set-ttl \u003cbucket\u003e --days 7`.\n- Step 3 (SDK): create `/home/user/tigris-task/index.ts` that imports from `@tigrisdata/storage` and uses the `put` function to upload an object whose key is `manifest.json` and whose body is the literal JSON string `{\"created_by\":\"cli\",\"modified_by\":\"sdk\",\"trial\":\"\u003ctrial_id\u003e\"}` (with `\u003ctrial_id\u003e` substituted from `/logs/artifacts/trial_id`). The object's Content-Type should be `application/json`. The upload must target the new bucket via `config: { bucket: bucketName }`. Run the program with `tsx /home/user/tigris-task/index.ts`.\n- Step 4 (CLI): list the bucket contents with `tigris ls t3://harbor-interop-${trial_id}/` and write stdout into `/home/user/tigris-task/bucket-listing.txt`. The listing file MUST mention the `manifest.json` key.\n\n## Implementation Guide\n1. Open a terminal in `/home/user/tigris-task`.\n2. Read the trial id:\n   ```bash\n   TRIAL_ID=\"$(cat /logs/artifacts/trial_id)\"\n   BUCKET=\"harbor-interop-${TRIAL_ID}\"\n   ```\n3. Create the snapshot-enabled bucket:\n   ```bash\n   tigris buckets create \"$BUCKET\" --enable-snapshots\n   ```\n4. Apply a 7-day object expiration TTL:\n   ```bash\n   tigris buckets set-ttl \"$BUCKET\" --days 7\n   ```\n5. Create `/home/user/tigris-task/index.ts`. The project is already initialized — `package.json` declares `@tigrisdata/storage` and `tsx`, and `node_modules/` is pre-populated. Example outline:\n   ```typescript\n   import { readFile } from \"node:fs/promises\";\n   import { put } from \"@tigrisdata/storage\";\n\n   const trialId = (await readFile(\"/logs/artifacts/trial_id\", \"utf-8\")).trim();\n   const bucket = `harbor-interop-${trialId}`;\n   const body = JSON.stringify({ created_by: \"cli\", modified_by: \"sdk\", trial: trialId });\n\n   const { data, error } = await put(\"manifest.json\", body, {\n     contentType: \"application/json\",\n     config: { bucket },\n   });\n   if (error) {\n     console.error(\"upload failed:\", error);\n     process.exit(1);\n   }\n   console.log(\"uploaded\", data);\n   ```\n6. Run the SDK uploader:\n   ```bash\n   tsx /home/user/tigris-task/index.ts\n   ```\n7. List bucket contents with the CLI and save the listing:\n   ```bash\n   tigris ls \"t3://${BUCKET}/\" \u003e /home/user/tigris-task/bucket-listing.txt\n   ```\n\n## Constraints\n- Project path: `/home/user/tigris-task`\n- Source file: `/home/user/tigris-task/index.ts`\n- Listing file: `/home/user/tigris-task/bucket-listing.txt`\n- Bucket name MUST be `harbor-interop-${trial_id}` (no other prefix or suffix), with `${trial_id}` taken verbatim from `/logs/artifacts/trial_id`. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Snapshots MUST be enabled at creation (`--enable-snapshots` on `tigris buckets create`). They cannot be enabled on an existing bucket.\n- The bucket TTL MUST be exactly 7 days (`tigris buckets set-ttl \u003cbucket\u003e --days 7`).\n- The uploaded object body MUST be exactly `{\"created_by\":\"cli\",\"modified_by\":\"sdk\",\"trial\":\"\u003ctrial_id\u003e\"}` (no extra whitespace, key ordering as written here), with `\u003ctrial_id\u003e` substituted.\n- The CLI is pre-authenticated via the AWS-compatible environment bridge in `/etc/profile.d/tigris-auth.sh`. From a login shell the CLI works directly; from a non-login shell, source that file first or pass `AWS_ACCESS_KEY_ID` / `AWS_SECRET_ACCESS_KEY` / `AWS_REGION=auto` inline.\n- Use the Tigris CLI (`tigris`) for bucket creation, TTL configuration, and final listing. Use the `@tigrisdata/storage` SDK from TypeScript for the manifest upload. Do not mix or substitute these (no AWS CLI, no raw HTTP, no `tigris cp`/`tigris put` for the manifest upload, no SDK for bucket creation/TTL).\n- Do not hardcode credentials.\n- Leave the bucket and `manifest.json` in place after completion — the verifier inspects them and then cleans up.\n\n## Integrations\n- Tigris Object Storage (real `https://t3.storage.dev` endpoint via the Tigris CLI and `@tigrisdata/storage` SDK).\n"])</script><script>self.__next_f.push([1,"12:T1d5d,"])</script><script>self.__next_f.push([1,"# Tigris Coordination: trigger only on `runs/*.finished` objects\n\n## Background\nThe Tigris Agent Kit (`@tigrisdata/agent-kit`) provides a `setupCoordination` primitive that wires Tigris object notifications to a webhook URL with an optional SQL-like filter on the object `key`. Tigris webhooks POST a JSON payload (see https://www.tigrisdata.com/docs/buckets/object-notifications/) of the form `{ \"events\": [{ ..., \"bucket\": \"...\", \"object\": { \"key\": \"...\", \"size\": ..., \"eTag\": \"...\" } }] }` for every matching object event.\n\nThe goal of this task is to provision a Tigris bucket, install a coordination rule that triggers **only** for object keys that both **start with `runs/`** and **end with the `.finished` extension**, then upload three test objects and demonstrate that exactly the one matching object fires a webhook delivery.\n\nThe container is pre-wired with two services running in the background:\n\n1. A tiny Node.js HTTP receiver listening on `http://localhost:8088/receive` that **appends each JSON POST body verbatim** as a single line to `/home/user/tigris-task/received.jsonl`.\n2. A `cloudflared` quick-tunnel pointing at `http://localhost:8088`. The container's entrypoint waits for the tunnel to come up and writes the public HTTPS URL to `/home/user/tigris-task/tunnel.url` (one line, e.g. `https://random-words.trycloudflare.com`).\n\nYou must use that public URL as the webhook target (Tigris's notification system cannot reach the container's `localhost` directly).\n\n## Requirements\nWrite and execute a TypeScript program `/home/user/tigris-task/run.ts` that performs the following steps in order using the Tigris SDKs and exits with code 0 on success:\n\n1. Read `trial_id` from `/logs/artifacts/trial_id` and `.trim()` it.\n2. Build the bucket name `harbor-coord-${trial_id}` (lowercase trial id). Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n3. Read the public webhook base URL from `/home/user/tigris-task/tunnel.url` and append `/receive` to form the final `webhookUrl`. If the tunnel URL file is missing or empty, retry with backoff for up to 60 seconds before failing.\n4. Use `createBucket` from `@tigrisdata/storage` to create the bucket. Snapshots are **not** required. If `createBucket` reports the bucket already exists, treat that as success.\n5. Use `setupCoordination` from `@tigrisdata/agent-kit` to register a notification rule on the bucket with:\n   - `webhookUrl` set to `${publicTunnel}/receive`.\n   - `filter` set to a SQL-like expression that matches keys with prefix `runs/` and suffix `.finished`. The recommended filter is: `` WHERE `key` REGEXP \"^runs/.*\\\\.finished$\" `` (escape the backslash inside the JS/TS string).\n6. Wait at least 5 seconds for the coordination rule to propagate.\n7. Upload the following three objects to the bucket using `put` from `@tigrisdata/storage` (set `Content-Type: text/plain` for each):\n   - `runs/run1.tmp` with body `not done yet` (must NOT fire the webhook).\n   - `runs/run1.finished` with body `done` (MUST fire the webhook exactly once).\n   - `other/run2.finished` with body `wrong prefix` (must NOT fire the webhook because the prefix does not match).\n8. Wait up to 30 seconds for notifications to be delivered to the receiver.\n9. Write a one-line summary to `/home/user/tigris-task/run.log` containing the bucket name and the resolved webhook URL, so the verifier can read back what was attempted.\n\nRun the program with `tsx /home/user/tigris-task/run.ts`. Do not mock any Tigris service: real Tigris credentials are exposed via the environment.\n\n## Implementation Guide\n1. `cd /home/user/tigris-task`. The directory already has a `package.json`, a `tsconfig.json`, and a pre-populated `node_modules` with `@tigrisdata/storage`, `@tigrisdata/agent-kit`, and `tsx`.\n2. Create `run.ts` (ESM, top-level await is fine). Sketch:\n   ```typescript\n   import { readFile, writeFile, stat } from \"node:fs/promises\";\n   import { createBucket, put } from \"@tigrisdata/storage\";\n   import { setupCoordination } from \"@tigrisdata/agent-kit\";\n\n   const trialId = (await readFile(\"/logs/artifacts/trial_id\", \"utf-8\")).trim();\n   const bucket = `harbor-coord-${trialId}`;\n\n   // Poll for tunnel.url for up to 60s\n   async function readTunnel(): Promise\u003cstring\u003e {\n     for (let i = 0; i \u003c 60; i++) {\n       try {\n         const raw = (await readFile(\"/home/user/tigris-task/tunnel.url\", \"utf-8\")).trim();\n         if (raw) return raw;\n       } catch {}\n       await new Promise((r) =\u003e setTimeout(r, 1000));\n     }\n     throw new Error(\"tunnel.url not ready\");\n   }\n   const base = await readTunnel();\n   const webhookUrl = `${base.replace(/\\/$/, \"\")}/receive`;\n\n   const created = await createBucket(bucket);\n   if (created.error \u0026\u0026 !/exist/i.test(String(created.error.message))) throw created.error;\n\n   const coord = await setupCoordination(bucket, {\n     webhookUrl,\n     filter: 'WHERE `key` REGEXP \"^runs/.*\\\\.finished$\"',\n   });\n   if (coord.error) throw coord.error;\n\n   await new Promise((r) =\u003e setTimeout(r, 5000));\n\n   const uploads: Array\u003c[string, string]\u003e = [\n     [\"runs/run1.tmp\", \"not done yet\"],\n     [\"runs/run1.finished\", \"done\"],\n     [\"other/run2.finished\", \"wrong prefix\"],\n   ];\n   for (const [key, body] of uploads) {\n     const r = await put(key, body, { config: { bucket }, contentType: \"text/plain\" });\n     if (r.error) throw r.error;\n   }\n\n   await new Promise((r) =\u003e setTimeout(r, 30000));\n\n   await writeFile(\n     \"/home/user/tigris-task/run.log\",\n     `bucket=${bucket}\\nwebhookUrl=${webhookUrl}\\n`,\n   );\n   ```\n3. Run with `tsx run.ts` from `/home/user/tigris-task`.\n4. Inspect `/home/user/tigris-task/received.jsonl` to debug: it should contain a JSON line with `events[0].object.key === \"runs/run1.finished\"` and nothing else.\n\n## Constraints\n- Project path: /home/user/tigris-task\n- Source file: /home/user/tigris-task/run.ts\n- Log file: /home/user/tigris-task/run.log\n- Tunnel URL file (pre-populated by the entrypoint): /home/user/tigris-task/tunnel.url\n- Received notifications file (pre-created empty, appended to by the receiver): /home/user/tigris-task/received.jsonl\n- Bucket name: `harbor-coord-${trial_id}` (read `${trial_id}` from `/logs/artifacts/trial_id`). Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n- Use the **real** Tigris service via `@tigrisdata/storage` and `@tigrisdata/agent-kit`. Do not mock the webhook delivery — Tigris must actually POST to the tunnel.\n- Do not hardcode credentials. The SDKs read them from `TIGRIS_STORAGE_ACCESS_KEY_ID`, `TIGRIS_STORAGE_SECRET_ACCESS_KEY`, `TIGRIS_STORAGE_ENDPOINT`.\n- Do not stop, kill, or restart the pre-running receiver (`node ... receiver.js`) or the `cloudflared` tunnel process.\n- The notification filter must encode **both** the `runs/` prefix and the `.finished` suffix. A filter that matches every key or only one of the two constraints will cause the verifier to fail (extra or missing notificat hens.\n- Configure the AWS CLI so the multipart threshold and chunk size are both 5 MB, ensuring a 16 MiB upload is performed as a multipart upload (≥4 parts).\n- Upload the pre-existing local file `/home/user/tigris-task/large.bin` (16 MiB, deterministic content) to the bucket under the object key `archives/large.bin` using `aws s3 cp` with `--cli-write-timeout 0`.\n- Compute the MD5 (hex digest) of the local file and write it (exactly 32 lowercase hex characters, no trailing newline allowed beyond a single optional `\\n`) to `/home/user/tigris-task/local.md5`.\n\n## Implementation Guide\n1. Read the trial id:\n   ```bash\n   TRIAL_ID=\"$(cat /logs/artifacts/trial_id)\"\n   BUCKET=\"harbor-mpu-${TRIAL_ID}\"\n   ```\n2. Create the Tigris bucket via the AWS CLI:\n   ```bash\n   aws s3 mb \"s3://${BUCKET}\"\n   ```\n3. Force a small multipart threshold/chunk size so the 16 MiB upload is performed as a multipart upload:\n   ```bash\n   aws configure set default.s3.multipart_threshold 5MB\n   aws configure set default.s3.multipart_chunksize 5MB\n   ```\n4. Upload the file using multipart upload:\n   ```bash\n   aws s3 cp --cli-write-timeout 0 \\\n       /home/user/tigris-task/large.bin \\\n       \"s3://${BUCKET}/archives/large.bin\"\n   ```\n5. Compute the local file's MD5 and write it to `/home/user/tigris-task/local.md5`:\n   ```bash\n   md5sum /home/user/tigris-task/large.bin | awk '{print $1}' \u003e /home/user/tigris-task/local.md5\n   ```\n6. (Optional) Confirm the upload worked: `aws s3api head-object --bucket \"${BUCKET}\" --key archives/large.bin`. The returned `ETag` should contain a `-` followed by the part count (multipart ETag format).\n\n## Constraints\n- Project path: /home/user/tigris-task\n- Pre-existing file: /home/user/tigris-task/large.bin (exactly 16 MiB = 16777216 bytes of NUL bytes, generated deterministically with `dd if=/dev/zero bs=1048576 count=16`). Do NOT modify or regenerate this file.\n- Bucket name format: `harbor-mpu-${trial_id}` where :T1706,"])</script><script>self.__next_f.push([1,"# Tigris Presigned URL: Unauthenticated Download via curl\n\n## Background\nTigris is a globally distributed, S3-compatible object storage service exposed at the single virtual-hosted-style endpoint `https://t3.storage.dev`. Because Tigris is S3-compatible, you can mint **AWS SigV4 presigned URLs** for it with the standard AWS Python SDK (boto3) via `s3_client.generate_presigned_url(\"get_object\", ...)`. The resulting URL embeds the signature in the query string (`X-Amz-Signature=...`) and can be fetched by *any* HTTP client without authentication headers — that is the entire point of a presigned URL.\n\nThe Harbor runtime injects the Tigris credentials and endpoint into the container as the AWS-flavored environment variables `AWS_ACCESS_KEY_ID`, `AWS_SECRET_ACCESS_KEY`, `AWS_ENDPOINT_URL_S3` (`https://t3.storage.dev`), and `AWS_REGION` (`auto`) so boto3 picks them up automatically.\n\n## Requirements\nFrom the project directory `/home/user/tigris-task`, perform the following steps **in order**:\n\n1. Read the per-trial id from `/logs/artifacts/trial_id` (strip surrounding whitespace) and derive the bucket name `harbor-presign-${trial_id}`. Do NOT hardcode the trial id. Note: S3 bucket names can only contain lowercase letters, numbers, dots, and hyphens. You must normalize the bucket name by converting it to lowercase and replacing any invalid characters (like underscores) with hyphens.\n2. Using **boto3**, create the bucket `harbor-presign-${trial_id}` (treat `BucketAlreadyOwnedByYou` as success).\n3. Using **boto3**, upload an object under the key `share/secret.txt` whose body is exactly the bytes `shareable content` (17 bytes — no newline, no quotes, no extra whitespace).\n4. Using `s3_client.generate_presigned_url(\"get_object\", Params={\"Bucket\": ..., \"Key\": \"share/secret.txt\"}, ExpiresIn=300)`, mint an S3 SigV4 presigned URL valid for **300 seconds** that grants read access to `share/secret.txt`.\n5. Wri
